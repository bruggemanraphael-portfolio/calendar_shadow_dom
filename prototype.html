<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendar</title>
        <link rel="stylesheet" href="../css/reset.css">
        <link rel="stylesheet" href="../css/colors.css">
        <link rel="stylesheet" href="../css/calendar.css">
        <style>
            td {
                padding: 10px;
                background-color: aquamarine;
                border-radius: 5px;
                text-align: center;
                box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5) inset;
            }
        </style>
    </head>
    <body>
        
        <script>
            let debug_mode = false;
            let month_max_days = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            let name_days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
            let month_names = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
            let current_month = 0;
            
            if (debug_mode) document.write('<textarea cols="100" rows="30">');
           
            while (current_month < month_max_days.length) {
                document.write('<h2>' + month_names[current_month] + '</h2>');
                document.write('<table>');
                print_days_name(name_days);
                print_table_month(month_max_days[current_month]);
                document.write('</table>');
                ++current_month;
            }

            function print_days_name(name_days) {
                for(let i = 0; i < name_days.length; ++i) {
                    document.write('<th>');
                    document.write(name_days[i]);
                    document.write('</th>');
                }
            }

            function print_table_month(max_day) {
                let today = new Date();
           
                let max_col = 7;
                let max_line = 5;
                let current_day = 1;
                for(let line = 0; line < max_line; ++line) {
                    document.write('<tr>');
                    for(let col = 0; col < max_col; ++col) {
                        if (current_day <= max_day) {
                            if (current_month === today.getMonth() && current_day === today.getDate()) {
                                document.write('<td style="background-color: green">' + current_day + '</td>');
                            } else {
                                document.write('<td>' + current_day + '</td>'); 
                            }
                        }
                        ++current_day;
                    }
                    document.write('</tr>');
                }
            }
            if (debug_mode) document.write('</textarea>');
                 
        </script>
    </body>

</html>
